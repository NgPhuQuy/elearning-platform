{% extends 'layout/base.html' %}

{% block content %}
    <h1>Tạo khóa học mới</h1>

    <!-- Nếu có lỗi, hiện thông báo ở đây -->
    {% if error %}
        <p style="color: red; font-weight: bold;">{{ error }}</p>
    {% endif %}

    <!-- enctype là BẮT BUỘC để upload ảnh -->
    <form method="POST" action="/create-course" enctype="multipart/form-data">
        <div>
            <label>Tên khóa học:</label>
            <input type="text" name="name" required>
        </div>

        <div>
            <label>Mô tả:</label>
            <textarea name="description" required></textarea>
        </div>

        <div>
            <label>Hình ảnh:</label>
            <input type="file" name="image" accept="image/*" required>
        </div>

      <div class="mb-3">
    <label class="form-label">Danh mục:</label>

    {% for c in categories %}
        <div class="form-check">
            <input
                class="form-check-input"
                type="checkbox"
                name="category_ids"
                value="{{ c.id }}"
                id="category{{ c.id }}">

            <label class="form-check-label" for="category{{ c.id }}">
                {{ c.name }}
            </label>
        </div>
    {% endfor %}
</div>

        <button type="submit">Tạo khóa học</button>
    </form>
{% endblock %}
