{% extends "layout/base.html" %}

{% block title %}Không thể làm bài kiểm tra · EduForum{% endblock %}

{% block content %}
<div class="d-flex flex-column gap-3" style="max-width:600px; margin:0 auto;">
    <div class="card-ef p-5 text-center">
        <i class="bi bi-lock-fill text-muted-ef" style="font-size:3rem;"></i>
        <h1 class="font-display fs-4 mt-3 mb-2">Chưa thể làm bài kiểm tra</h1>
        <p class="text-muted-ef mb-4">{{ error }}</p>
        <a href="{{ url_for('learn_course', course_id=course_id) }}" class="btn btn-indigo">
            <i class="bi bi-arrow-left"></i> Quay lại khóa học
        </a>
    </div>
</div>
{% endblock %}
