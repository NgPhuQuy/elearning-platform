<header class="ef-topbar d-flex align-items-center px-3 px-lg-4 gap-3">
    <h1 class="font-display fs-6 mb-0 d-none d-sm-block">{{ page_title | default('Trang chủ') }}</h1>

    <search class="flex-grow-1 mx-auto" style="max-width:420px;">
        <form role="search" action="{{ url_for('forum') }}" method="get" class="position-relative">
            <i class="bi bi-search position-absolute text-muted-ef"
               style="left:.8rem; top:50%; transform:translateY(-50%); font-size:.8rem;" aria-hidden="true"></i>
            <label for="search-input" class="visually-hidden">Tìm kiếm câu hỏi, khóa học</label>
            <input id="search-input" name="q" type="search" class="form-control form-control-sm bg-slate-50"
                   style="padding-left:2.2rem; border-radius:.7rem;" placeholder="Tìm kiếm câu hỏi, khóa học...">
        </form>
    </search>

    <div class="d-flex align-items-center gap-2 ms-auto">
        <a href="{{ url_for('forum') }}#ask"
           class="btn btn-indigo btn-sm d-none d-md-inline-flex align-items-center gap-1"><i class="bi bi-plus-circle"
                                                                                             aria-hidden="true"></i> Đặt
            câu hỏi</a>
        <button type="button" class="btn btn-sm btn-light position-relative rounded-3" style="width:36px;height:36px;"
                aria-label="Thông báo">
            <i class="bi bi-bell" aria-hidden="true"></i>
            {% if unread_notifications %}
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                      style="font-size:.55rem;">{{ unread_notifications }}</span>{% endif %}
        </button>
        <a href="{{ url_for('profile') }}"
           class="rounded-3 border border-2 d-flex align-items-center justify-content-center"
           style="width:36px;height:36px; border-color:var(--ef-indigo-200)!important;">
            <span class="ef-avatar ef-avatar-indigo"
                  style="width:32px;height:32px;font-size:.75rem;">{{ current_user.initials }}</span>
        </a>
    </div>
</header>
