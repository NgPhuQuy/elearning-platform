{% extends "layout/base.html" %}

{% block title %}Đổi mật khẩu - Academix{% endblock %}

{% block content %}
    <section class="auth-section" aria-labelledby="login-heading">
        <h1 id="login-heading">Dổi mật khẩu</h1>

        {% if error %}
            <p role="alert" class="form-error">{{ error }}</p>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            <fieldset>

                <p>
                    <label for="password">Mật khẩu hiện tại</label>
                    <input type="password" id="curr_password" name="curr_password" minlength="3" required>
                </p>

                <p>
                    <label for="password">Mật khẩu mới</label>
                    <input type="password" id="new_password" name="new_password" minlength="6" required>
                </p>

                <p>
                    <label for="confirm">Xác nhận mật khẩu mới</label>
                    <input type="password" id="new_confirm" name="new_confirm" minlength="6" required>
                </p>

            </fieldset>

            <button type="submit">Xác nhận</button>
        </form>


    </section>
{% endblock %}
