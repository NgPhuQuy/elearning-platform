<div class="chat-info-inner">

    <div id="infoEmpty"
         class="text-center text-muted">

        <i class="bi bi-info-circle fs-3"></i>

        <p class="mt-2">
            Chọn một cuộc trò chuyện
        </p>

    </div>


    <div id="infoContent"
         class="d-none">

        <div class="text-center mb-4">

            <div id="infoAvatar"
                 class="chat-info-avatar">
                ?
            </div>

            <h5 id="infoName"
                class="mt-2 mb-1">
            </h5>

            <p id="infoStatus"
               class="text-muted small">
            </p>

        </div>


        <div class="info-section">

            <p class="info-title">
                Thông tin
            </p>

            <div class="info-item">

                <i class="bi bi-person"></i>

                <span id="infoRole">
                </span>

            </div>

        </div>

    </div>

</div>
