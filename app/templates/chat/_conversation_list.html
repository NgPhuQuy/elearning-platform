<div class="d-flex align-items-center justify-content-between mb-3">

    <h2 class="chat-title mb-0">
        Tin nhắn
    </h2>

    <button
        type="button"
        class="btn btn-light border rounded-circle"
        id="newChatBtn"
        title="Tin nhắn mới"
    >
        <i class="bi bi-person-plus-fill text-primary"></i>
    </button>

</div>


<div class="conversation-list">

    <p class="conversation-section">
        Cuộc trò chuyện
    </p>

    <div id="conversationList">

        <div class="chat-empty">
            <i class="bi bi-chat-dots"></i>

            <p>Đang tải cuộc trò chuyện...</p>
        </div>

    </div>

</div>

<div
    class="modal fade"
    id="newChatModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered">


    <div class="modal-content">

        <div class="modal-header">

            <h5 class="modal-title">
                Tin nhắn mới
            </h5>

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Đóng"
            ></button>

        </div>

        <div class="modal-body">

            <label
                for="chatUsername"
                class="form-label"
            >
                Tìm người dùng
            </label>

            <input
                type="text"
                id="chatUsername"
                class="form-control"
                placeholder="Nhập tên hoặc username..."
                autocomplete="off"
            >

            <!-- Danh sách kết quả -->
            <div
                id="userSearchResults"
                class="list-group mt-2"
            ></div>

            <!-- User đã chọn -->
            <div
                id="selectedUser"
                class="mt-2 d-none"
            ></div>

            <div
                id="newChatError"
                class="text-danger small mt-2 d-none"
            ></div>

        </div>

        <div class="modal-footer">

            <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
            >
                Hủy
            </button>

            <button
                type="button"
                class="btn btn-primary"
                id="startChatBtn"
                disabled
            >
                <i class="bi bi-chat-dots me-1"></i>
                Nhắn tin
            </button>

        </div>

    </div>

</div>


</div>
