<div
    class="modal fade"
    id="emojiModal"
    tabindex="-1">

    <div class="modal-dialog modal-sm modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h6 class="modal-title">

                    Chọn biểu cảm

                </h6>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">

                </button>

            </div>

            <div class="modal-body">

                <div
                    class="d-grid"
                    style="grid-template-columns:repeat(6,1fr);gap:.5rem;">

                    {% for emoji in [
                        "😀","😁","😂","🤣",
                        "😍","😘","😎","😭",
                        "😡","👍","👏","🙏",
                        "❤️","🔥","🎉","💯",
                        "🤔","😢","😆","😅",
                        "😇","🤩","😱","🤯"
                    ] %}

                    <button
                        class="btn btn-light emoji-item"
                        data-emoji="{{ emoji }}">

                        {{ emoji }}

                    </button>

                    {% endfor %}

                </div>

            </div>

        </div>

    </div>

</div>
