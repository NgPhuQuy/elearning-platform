{% extends 'layout/base.html' %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/forum.css') }}">

<div class="container mt-4">

    <h2>Create Discussion</h2>

    <form method="post" enctype="multipart/form-data" class="forum-form">

        <div class="mb-3">

            <label class="form-label">
                Title
            </label>

            <input type="text"
                   class="form-control"
                   name="title"
                   placeholder="Enter discussion title"
                   required>

        </div>


        <!-- Category -->
        <div class="mb-3">

            <label class="form-label">
                Category
            </label>

            <select name="category_id"
                    class="form-control"
                    required>

                <option value="">
                    -- Select category --
                </option>


                {% for c in categories %}

                <option value="{{ c.id }}">
                    {{ c.name }}
                </option>

                {% endfor %}


            </select>

        </div>


        <!-- Content -->
        <div class="mb-3">

            <label class="form-label">
                Content
            </label>

            <textarea
                    name="content"
                    rows="6"
                    class="form-control"
                    placeholder="Write your discussion..."
                    required></textarea>

        </div>


        <!-- Image -->
        <div class="mb-3">

            <label class="form-label">
                Image
            </label>

            <input type="file"
                   class="form-control"
                   name="image"
                   accept="image/*">

        </div>


        <button type="submit"
                class="btn btn-success">
            Create Post
        </button>


        <a href="{{ url_for('forum') }}"
           class="btn btn-secondary">
            Cancel
        </a>


    </form>

</div>

{% endblock %}
