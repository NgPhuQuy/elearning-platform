name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Immutable GHCR image (ghcr.io/owner/repository@sha256:...)
        required: true
        type: string
      deployment_kind:
        description: Release a new version or roll back to a previous image
        required: true
        default: release
        type: choice
        options:
          - release
          - rollback
      staging_verified:
        description: Confirm that this exact image was verified on staging
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      database_backup_confirmed:
        description: Confirm that a recoverable database backup exists
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      release_notes:
        description: Change summary, incident reference, or rollback reason
        required: true
        type: string
      confirmation:
        description: Type PRODUCTION to continue
        required: true
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

jobs:
  validate-release:
    name: Validate production release
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.release.outputs.image_ref }}
      image_digest: ${{ steps.release.outputs.image_digest }}
    steps:
      - name: Validate operator confirmations
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_VERIFIED: ${{ inputs.staging_verified }}
          DATABASE_BACKUP_CONFIRMED: ${{ inputs.database_backup_confirmed }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "PRODUCTION" ]]; then
            echo "::error::Production confirmation must be exactly PRODUCTION."
            exit 1
          fi
          if [[ "$STAGING_VERIFIED" != "yes" ]]; then
            echo "::error::The exact image must be verified on staging first."
            exit 1
          fi
          if [[ "$DATABASE_BACKUP_CONFIRMED" != "yes" ]]; then
            echo "::error::Confirm a recoverable database backup before deployment."
            exit 1
          fi

      - name: Validate immutable image reference
        id: release
        shell: bash
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          expected_prefix="${REGISTRY}/${repository}@sha256:"
          case "$IMAGE_REF" in
            "$expected_prefix"*)
              ;;
            *)
              echo "::error::Image must be belong to ${REGISTRY}/${repository} and use an immutable digest."
              exit 1
              ;;
          esac
          digest="${IMAGE_REF#"$expected_prefix"}"
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Image digest must be contain exactly 64 lowercase hexadecimal characters."
            exit 1
          fi
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "image_digest=sha256:${digest}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image manifest exists
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ steps.release.outputs.image_ref }}"

      - name: Write validation summary
        shell: bash
        env:
          IMAGE_REF: ${{ steps.release.outputs.image_ref }}
          DEPLOYMENT_KIND: ${{ inputs.deployment_kind }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          {
            echo "## Production release validation"
            echo
            echo "- Operation: \`${DEPLOYMENT_KIND}\`"
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Staging verification: confirmed"
            echo "- Recoverable database backup: confirmed"
            echo "- Notes: ${RELEASE_NOTES}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy Render production
    needs:
      - validate-release
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_PRODUCTION_URL }}
    steps:
      - name: Trigger immutable production deployment
        shell: bash
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}
          IMAGE_REF: ${{ needs.validate-release.outputs.image_ref }}
          DEPLOYMENT_KIND: ${{ inputs.deployment_kind }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOOK_URL:-}" ]]; then
            echo "::error::RENDER_PRODUCTION_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status_code="$(
            curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --get \
            --data-urlencode "imgURL=${IMAGE_REF}" \
            "$DEPLOY_HOOK_URL"
          )"
          case "$status_code" in
            200|202)
              echo "Render accepted the production deployment request (HTTP $status_code)."
              ;;
            *)
              echo "::error::Render rejected the production deployment request (HTTP $status_code)."
              cat "$response_file"
              exit 1
              ;;
          esac
          {
            echo "## Render production deployment"
            echo
            echo "- Operation: \`${DEPLOYMENT_KIND}\`"
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Render response: HTTP \`${status_code}\`"
            echo "- Notes: ${RELEASE_NOTES}"
            echo
            echo "Application rollback is performed by deploying a previous immutable image digest."
            echo "This workflow never runs an automatic database downgrade."
          } >> "$GITHUB_STEP_SUMMARY"